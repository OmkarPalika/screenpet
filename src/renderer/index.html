<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <title>screenpet</title>
    <link rel="stylesheet" href="pets.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- A break, once you take one: everything behind the pet dims, it walks to
         the middle of the screen, and it either sits and breathes or drinks.
         Click anywhere on this to stop it early. -->
    <div id="veil" class="veil" hidden></div>
    <p id="counting" class="counting" hidden></p>

    <!-- The window covers the whole display; this is the bit that moves. -->
    <div id="stage" class="stage">
      <div id="bubble" class="bubble" hidden><span id="bubble-text"></span></div>

      <!-- The pet wondering whether you want a break. A thought rather than a
           line of speech, because it is offering: nothing happens until you
           click it, and ignored it goes away on its own and asks again later. -->
      <button id="thought" class="thought" type="button" hidden>
        <span id="thought-face" class="thought-face"></span>
      </button>

      <div id="menu" class="menu" hidden>
        <button data-act="feed">Feed</button>
        <button data-act="play">Play</button>
        <button data-act="tickle">Tickle</button>
        <button data-talk>Talk…</button>
        <!-- Hidden until the microphone is switched on in settings. -->
        <button data-listen hidden>Listen…</button>
        <button data-ask>Read screen</button>
        <button data-settings>Settings…</button>
        <button data-quit>Quit</button>
      </div>

      <!-- Typing needs focus, which this window normally refuses to take. The
           main process makes it focusable only while this is open. -->
      <form id="chat" class="chat" hidden>
        <input
          id="chat-input"
          type="text"
          maxlength="500"
          autocomplete="off"
          placeholder="say something…"
          aria-label="talk to the pet"
        />
      </form>

      <div id="pet" class="pet" data-mood="neutral">
        <div id="fx" class="fx"></div>
        <!-- The glass, for a water break. Drawn beside the pet rather than in
             the SVG so it is the same glass whichever species is holding it -
             and the water level in it is the countdown, which is a better clock
             than a number because you can see it without reading it. -->
        <div id="glass" class="glass" hidden><i id="water"></i></div>
        <!-- Lit only while the camera stream is actually open. -->
        <div id="cam" class="cam" hidden title="camera on"></div>
        <!-- ...and this one for as long as the pet is reading the screen on a
             timer rather than waiting to be asked. -->
        <div id="reading" class="reading" hidden title="reading the screen"></div>
        <svg viewBox="0 0 120 110" width="120" height="110" aria-hidden="true">
          <ellipse class="shadow" cx="60" cy="102" rx="34" ry="6" />

          <!-- Everything except the shadow turns with the cursor. The shadow
               stays where it is, because the floor does not turn. -->
          <g class="turn">
          <!-- Behind the body on purpose: a tail drawn in front looks stuck on. -->
          <path class="tail" d="" />
          <path class="crest" d="" />
          <!-- Same reason, more so: a cape drawn in front of the body is a bib. -->
          <path class="cape" d="M34 36q26-8 52 0l24 64q-50-13-100 0z" />
          <path
            class="body"
            d="M60 14c26 0 42 18 42 42 0 24-16 40-42 40S18 80 18 56c0-24 16-42 42-42z"
          />
          <path class="ear ear-l" d="M28 26c6-10 16-12 20-4-8 2-15 8-20 12z" />
          <path class="ear ear-r" d="M92 26c-6-10-16-12-20-4 8 2 15 8 20 12z" />

          <!-- Everything that follows the cursor sits in .gaze. The blink lives
               on .eyes and an animation owns the whole transform property, so
               the two cannot share an element. -->
          <g class="gaze">
            <g class="eyes">
              <ellipse class="eye" cx="45" cy="54" rx="6" ry="7" />
              <ellipse class="eye" cx="75" cy="54" rx="6" ry="7" />
              <circle class="glint" cx="47" cy="51" r="2" />
              <circle class="glint" cx="77" cy="51" r="2" />
            </g>
            <g class="lids">
              <path class="lid lid-l" d="M39 54h12" />
              <path class="lid lid-r" d="M69 54h12" />
            </g>
            <g class="eyes-love">
              <path d="M45 49c3-4 8-1 0 8-8-9-3-12 0-8z" />
              <path d="M75 49c3-4 8-1 0 8-8-9-3-12 0-8z" />
            </g>
          </g>

          <g class="brows">
            <path class="brow brow-l" d="M38 41q7-3 14 0" />
            <path class="brow brow-r" d="M68 41q7-3 14 0" />
          </g>

          <ellipse class="cheek" cx="34" cy="66" rx="6" ry="4" />
          <ellipse class="cheek" cx="86" cy="66" rx="6" ry="4" />
          <path id="mouth" class="mouth" d="M53 70q7 7 14 0" />
          <path class="tongue" d="M56 71q4 9 8 0z" />

          <!-- Mood and expression props. All display:none until asked for. -->
          <path class="tear" d="M44 62q3 7 0 9-3-2 0-9z" />
          <path class="tear tear-r" d="M76 62q3 7 0 9-3-2 0-9z" />
          <path class="sweat" d="M94 38q4 8 0 10-4-2 0-10z" />
          <text class="zzz" x="93" y="30">z</text>
          <path class="spark" d="M99 30l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" />
          <path class="anger" d="M84 26h9M88 22l-3 9M97 22l-3 9" />
          <path class="whiskers" d="" />

          <!-- Worn, not drawn into the body, so every species can put it on.
               Same reason the bow is: one pair of shades and one halo rather
               than six of each. -->
          <g class="shades">
            <rect class="lens" x="32" y="46" width="24" height="13" rx="5" />
            <rect class="lens" x="64" y="46" width="24" height="13" rx="5" />
            <path class="bridge" d="M56 51h8" />
          </g>
          <ellipse class="halo" cx="60" cy="8" rx="16" ry="4.5" />

          <g class="bow">
            <path class="bow-loop" d="M37 28c-8-6-15-2-14 4 1 5 8 5 14-4z" />
            <path class="bow-loop" d="M37 28c8-6 15-2 14 4-1 5-8 5-14-4z" />
            <circle class="bow-knot" cx="37" cy="28" r="3.1" />
          </g>

          <!-- The wardrobe. Same trick as the three above and drawn last, so it
               sits over the face rather than under it. The bow, the shades and
               the halo are outfits too - they were already here, so wearing one
               costs a rule rather than a shape. -->
          <g class="wardrobe">
            <!-- Holes, not lenses: a mask that covers the eyes takes the gaze,
                 the blink and most of the forty faces with it. -->
            <path
              class="mask"
              fill-rule="evenodd"
              d="M24 44q36-11 72 0v18q-36 11-72 0z
                 M36 54a9 10 0 1 0 18 0a9 10 0 1 0-18 0
                 M66 54a9 10 0 1 0 18 0a9 10 0 1 0-18 0"
            />
            <g class="hat-party">
              <path class="cone" d="M60 2 47 26h26z" />
              <circle class="pom" cx="60" cy="2" r="3.4" />
            </g>
            <g class="hat-wizard">
              <ellipse class="brim" cx="60" cy="28" rx="25" ry="5" />
              <path class="cone" d="M60 0 44 28h32z" />
            </g>
            <path class="crown" d="M38 28 44 12l8 9 8-13 8 13 8-9 6 16z" />
            <g class="cans">
              <path class="band" d="M26 50q0-36 34-36t34 36" />
              <rect class="can" x="18" y="46" width="12" height="18" rx="4" />
              <rect class="can" x="90" y="46" width="12" height="18" rx="4" />
            </g>
          </g>
          </g>
        </svg>

        <!-- Widths are set from JS. Inline style attributes would need
             'unsafe-inline' in the CSP, which is not worth it for three bars. -->
        <div id="bars" class="bars">
          <div class="bar"><i data-bar="fullness"></i></div>
          <div class="bar"><i data-bar="happiness"></i></div>
          <div class="bar"><i data-bar="energy"></i></div>
        </div>
      </div>
    </div>

    <!-- The camera pipeline, off screen. The video is never shown and the
         canvas is 32x24 - see "the room" in renderer.js for what is and is not
         done with the frames. The stream is 640x480 only so that a photo you
         asked for is worth keeping; presence still reads the tiny canvas. -->
    <video id="cam-video" width="640" height="480" muted playsinline hidden></video>
    <canvas id="cam-canvas" width="32" height="24" hidden></canvas>

    <!-- Before renderer.js, which calls into it. Both are classic scripts, so
         what this declares at the top level is what the other one can see. -->
    <script src="lighting.js"></script>
    <script src="voices.js"></script>
    <script src="robot.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
