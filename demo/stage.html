<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>screenpet demo stage</title>
    <!-- The real pet stylesheets, so the demo shows the actual UI. -->
    <link rel="stylesheet" href="../renderer/pets.css" />
    <link rel="stylesheet" href="../renderer/style.css" />
    <link rel="stylesheet" href="stage.css" />
  </head>
  <body>
    <!-- A mock quiz page for the pet to read. Generic on purpose: it is not
         imitating any real site or product. -->
    <div class="page" id="page">
      <div class="card">
        <p class="eyebrow">Practice Quiz · Question 4 of 10</p>
        <h1>What is 17 × 23 ?</h1>
      </div>
    </div>

    <div class="badge" id="badge">Ctrl + Shift + Space</div>

    <div class="pet-layer" id="pet-layer">
      <div id="bubble" class="bubble" hidden><span id="bubble-text"></span></div>

      <div id="pet" class="pet" data-mood="neutral">
        <div id="fx" class="fx"></div>
        <svg viewBox="0 0 120 110" width="120" height="110" aria-hidden="true">
          <ellipse class="shadow" cx="60" cy="102" rx="34" ry="6" />
          <path class="tail" d="" />
          <path class="crest" d="" />
          <path
            class="body"
            d="M60 14c26 0 42 18 42 42 0 24-16 40-42 40S18 80 18 56c0-24 16-42 42-42z"
          />
          <path class="ear ear-l" d="M28 26c6-10 16-12 20-4-8 2-15 8-20 12z" />
          <path class="ear ear-r" d="M92 26c-6-10-16-12-20-4 8 2 15 8 20 12z" />
          <g class="gaze">
            <g class="eyes">
              <ellipse class="eye" cx="45" cy="54" rx="6" ry="7" />
              <ellipse class="eye" cx="75" cy="54" rx="6" ry="7" />
              <circle class="glint" cx="47" cy="51" r="2" />
              <circle class="glint" cx="77" cy="51" r="2" />
            </g>
            <g class="lids">
              <path class="lid lid-l" d="M39 54h12" />
              <path class="lid lid-r" d="M69 54h12" />
            </g>
            <g class="eyes-love">
              <path d="M45 49c3-4 8-1 0 8-8-9-3-12 0-8z" />
              <path d="M75 49c3-4 8-1 0 8-8-9-3-12 0-8z" />
            </g>
          </g>
          <g class="brows">
            <path class="brow brow-l" d="M38 41q7-3 14 0" />
            <path class="brow brow-r" d="M68 41q7-3 14 0" />
          </g>
          <ellipse class="cheek" cx="34" cy="66" rx="6" ry="4" />
          <ellipse class="cheek" cx="86" cy="66" rx="6" ry="4" />
          <path class="mouth" d="M53 70q7 7 14 0" />
          <path class="tongue" d="M56 71q4 9 8 0z" />
          <path class="tear" d="M44 62q3 7 0 9-3-2 0-9z" />
          <path class="tear tear-r" d="M76 62q3 7 0 9-3-2 0-9z" />
          <path class="sweat" d="M94 38q4 8 0 10-4-2 0-10z" />
          <text class="zzz" x="93" y="30">z</text>
          <path class="spark" d="M99 30l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" />
          <path class="anger" d="M84 26h9M88 22l-3 9M97 22l-3 9" />
          <path class="whiskers" d="" />
          <g class="bow">
            <path class="bow-loop" d="M37 28c-8-6-15-2-14 4 1 5 8 5 14-4z" />
            <path class="bow-loop" d="M37 28c8-6 15-2 14 4-1 5-8 5-14-4z" />
            <circle class="bow-knot" cx="37" cy="28" r="3.1" />
          </g>
        </svg>
      </div>
    </div>

    <script src="stage.js"></script>
  </body>
</html>
