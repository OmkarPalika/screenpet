<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>screenpet demo stage</title>
    <!-- The real pet stylesheet, so the demo shows the actual UI. -->
    <link rel="stylesheet" href="../renderer/style.css" />
    <link rel="stylesheet" href="stage.css" />
  </head>
  <body>
    <!-- A mock quiz page for the pet to read. Generic on purpose: it is not
         imitating any real site or product. -->
    <div class="page" id="page">
      <div class="card">
        <p class="eyebrow">Practice Quiz · Question 4 of 10</p>
        <h1>What is 17 × 23 ?</h1>
      </div>
    </div>

    <div class="badge" id="badge">Ctrl + Shift + Space</div>

    <div class="pet-layer" id="pet-layer">
      <div id="bubble" class="bubble" hidden><span id="bubble-text"></span></div>

      <div id="pet" class="pet" data-mood="neutral">
        <div id="hearts" class="hearts"></div>
        <svg viewBox="0 0 120 110" width="120" height="110" aria-hidden="true">
          <ellipse class="shadow" cx="60" cy="102" rx="34" ry="6" />
          <path
            class="body"
            d="M60 14c26 0 42 18 42 42 0 24-16 40-42 40S18 80 18 56c0-24 16-42 42-42z"
          />
          <path class="ear" d="M28 26c6-10 16-12 20-4-8 2-15 8-20 12z" />
          <path class="ear" d="M92 26c-6-10-16-12-20-4 8 2 15 8 20 12z" />
          <g class="eyes">
            <ellipse class="eye" cx="45" cy="54" rx="6" ry="7" />
            <ellipse class="eye" cx="75" cy="54" rx="6" ry="7" />
            <circle class="glint" cx="47" cy="51" r="2" />
            <circle class="glint" cx="77" cy="51" r="2" />
          </g>
          <g class="lids">
            <path d="M39 54h12" />
            <path d="M69 54h12" />
          </g>
          <ellipse class="cheek" cx="34" cy="66" rx="6" ry="4" />
          <ellipse class="cheek" cx="86" cy="66" rx="6" ry="4" />
          <path class="mouth" d="M53 70q7 7 14 0" />
        </svg>
      </div>
    </div>

    <script src="stage.js"></script>
  </body>
</html>
