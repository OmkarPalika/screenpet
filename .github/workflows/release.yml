name: release

# Tag-driven, not push-driven. `npm version patch` writes the tag and the
# commit together, so pushing the tag is the one deliberate act that means
# "ship this" - and nothing on main can trigger a release by accident.
on:
  push:
    tags: ['v*']

# electron-builder --publish always creates the release and uploads to it.
# That needs write access to this repository's contents and nothing else.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # electron-builder names the release after package.json's version, not
      # after the tag that triggered this. A mismatch publishes v0.1.1 as a
      # release called 0.1.0 and the update button never sees it, so refuse
      # early rather than explain it later.
      - shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          test "$tag" = "$pkg" || {
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          }

      - run: npm ci
      - run: node test/test.js

      # Uploads the installer, the portable build and latest.yml to a draft
      # release. latest.yml holds the SHA-512 the in-app updater checks the
      # download against, and it only exists on the publish path - `npm run
      # dist` does not produce it. Publish the draft to make the release live.
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Not here: macOS. src/system/mac/screenpet-helper is Swift and has never been
# compiled on any machine, so a macos-latest job would be publishing a build
# nobody has ever run. Add it after the first one is built and used by hand.
#
# Not here: signing. The binaries go out unsigned - see SECURITY.md for what
# that costs. When a certificate exists it belongs in this job as
# CSC_LINK/CSC_KEY_PASSWORD secrets, not in the repository.
