name: release

# Tag-driven, not push-driven. `npm version patch` writes the tag and the
# commit together, so pushing the tag is the one deliberate act that means
# "ship this" - and nothing on main can trigger a release by accident.
on:
  push:
    tags: ['v*']

# electron-builder --publish always creates the release and uploads to it.
# That needs write access to this repository's contents and nothing else.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # electron-builder names the release after package.json's version, not
      # after the tag that triggered this. A mismatch publishes v0.1.1 as a
      # release called 0.1.0 and the update button never sees it, so refuse
      # early rather than explain it later.
      - shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          test "$tag" = "$pkg" || {
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          }

      - run: npm ci
      - run: node test/test.js

      # Make the draft before electron-builder can, because it cannot do it once.
      #
      # It uploads artefacts concurrently and each upload asks "is there a
      # release for this tag yet?" before starting. On v0.2.0 two of them asked
      # at the same second, both heard no, and both made one - so the tag ended
      # up with two drafts and the four files split across them. Whichever got
      # published would have been wrong: one held only the blockmap, the other
      # held an installer with no blockmap, which is what electron-updater reads
      # to download a diff rather than the whole 112MB again.
      #
      # An existing draft turns every one of those questions into a yes, so they
      # all attach to this one. `|| true` because a re-run of a release that got
      # this far finds its own draft already there, and that is not a failure.
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "" || true

      # Uploads the installer, the portable build and latest.yml to a draft
      # release. latest.yml holds the SHA-512 the in-app updater checks the
      # download against, and it only exists on the publish path - `npm run
      # dist` does not produce it. Publish the draft to make the release live.
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The step above is the fix; this is the part that notices if it stops
      # working. The race was silent - a green build, and two drafts nobody
      # looks at until the day they publish one. Red here instead.
      - name: one draft, and all four files on it
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"

          n="$(gh api "repos/$GITHUB_REPOSITORY/releases"                  --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | length")"
          test "$n" = "1" || {
            echo "expected 1 release on $GITHUB_REF_NAME, found $n - the race is back"
            exit 1
          }

          have="$(gh release view "$GITHUB_REF_NAME" --json assets                     --jq '[.assets[].name] | sort | join(" ")')"
          want="latest.yml screenpet-$v-portable.exe screenpet-$v-setup.exe screenpet-$v-setup.exe.blockmap"
          test "$have" = "$want" || {
            echo "assets on the draft are wrong"
            echo "  want: $want"
            echo "  have: $have"
            exit 1
          }

          echo "one draft, four files"

# Not here: macOS. src/system/mac/screenpet-helper now compiles and answers on
# its contract in ci.yml on every push, which is not the same as being ready to
# ship: nobody has run the app around it on a real Mac, and a .dmg built here
# would be unsigned and unnotarized, which Gatekeeper refuses outright rather
# than warns about. Add the job once the first hand-built one has been used.
#
# Not here: signing. The binaries go out unsigned - see SECURITY.md for what
# that costs and BUILDING.md for the routes.
#
# When it arrives it will not look like CSC_LINK/CSC_KEY_PASSWORD. Those carry a
# .pfx, and since June 2023 no CA issues one: the private key has to live on
# FIPS 140-2 Level 2 hardware. The SignPath Foundation is exactly that
# arrangement - their certificate, their HSM, a key this repository never holds
# and that no secret here could carry even if it wanted to. So the step is an
# exchange, not an environment variable: submit the built artefact, wait, take
# the signed one back.
#
# They refused this project in September 2026, for want of public visibility
# rather than for anything in this file, and invited a second application later.
# So this stays the intended route and the order below is what to build when it
# lands - not a plan for a certificate that turned up.
#
# Which breaks the job above in a way worth writing down before somebody meets
# it at two in the morning. The release script builds and publishes in one call,
# and latest.yml carries the SHA-512 the in-app updater checks a download
# against. Sign after that and the hash describes a file nobody will ever
# receive, so every update fails its integrity check and the feature looks
# compromised rather than misordered. The order has to become: build without
# publishing, sign, regenerate latest.yml over the signed installer, then
# upload. Not --publish always with a signing step bolted onto the end.
