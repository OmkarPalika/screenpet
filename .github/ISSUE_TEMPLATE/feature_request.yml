name: Feature request
description: Something the pet should be able to do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Read [Known ceilings](https://github.com/OmkarPalika/screenpet#known-ceilings)
        first — several obvious ideas are already there with the reason they
        were not done.

  - type: textarea
    id: problem
    attributes:
      label: What is annoying you
      description: >
        The problem, not the solution. "I have to open Settings every time I
        change models" tells me more than "add a model dropdown to the tray",
        and often has a better answer than the one you had in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you think should happen
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Would this need the network?
      description: >
        On the default settings nothing leaves the machine. Anything that sends
        data anywhere has to be a switch that is off out of the box, so it is
        worth saying up front.
      options:
        - "No"
        - "Yes, and it should be off by default"
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: help
    attributes:
      label: Would you write it?
      options:
        - label: I would be willing to open a pull request for this.
